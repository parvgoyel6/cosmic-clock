<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>India Standard Time — Cosmic Glass Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Serif:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --slot-w: 86px;
    --slot-h: 130px;
    --font-digit: 72px;

    --gold: #e5be7d;
    --champagne: #f7ede0;
    --rose: #e6a294;
    --violet: #a18cd1;
    --cyan-glow: #64d2ff;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #020207;
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow-x: hidden;
    color: #f7f6f2;
  }

  #webgl-bg {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .film-layer {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(circle at center, transparent 30%, rgba(2, 2, 7, 0.75) 100%),
      linear-gradient(180deg, rgba(2, 2, 7, 0.4) 0%, transparent 40%, rgba(2, 2, 7, 0.75) 100%);
  }

  #stage {
    min-height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 3;
    padding: 40px 20px;
    perspective: 1200px;
    text-align: center;
  }

  .kicker {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 0 0 16px;
    font-family: 'Cinzel', serif;
    font-size: clamp(14px, 1.8vw, 22px);
    font-weight: 700;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: var(--champagne);
    text-shadow: 0 0 24px rgba(100, 210, 255, 0.35);
  }

  .kicker::before,
  .kicker::after {
    content: '';
    width: clamp(32px, 5vw, 70px);
    height: 1.5px;
    border-radius: 99px;
    background: linear-gradient(90deg, transparent, rgba(100, 210, 255, 0.85));
    box-shadow: 0 0 10px rgba(100, 210, 255, 0.4);
  }

  .kicker::after {
    background: linear-gradient(90deg, rgba(100, 210, 255, 0.85), transparent);
  }

  .date-display {
    margin: 0 0 34px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(12px, 1.1vw, 15px);
    font-weight: 600;
    letter-spacing: 5px;
    color: rgba(247,246,242,.85);
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
  }

  #sceneWrap {
    transform-style: preserve-3d;
    will-change: transform;
    display: flex;
    justify-content: center;
  }

  .glass-rim {
    position: relative;
    width: auto;
    max-width: 96vw;
    margin: 0 auto;
    padding: 1px;
    border-radius: 40px;
    background: linear-gradient(110deg,
      rgba(255,255,255,.45),
      rgba(100,210,255,.55) 20%,
      rgba(161,140,209,.45) 50%,
      rgba(229,190,125,.55) 75%,
      rgba(255,255,255,.3));
    box-shadow:
      0 35px 90px -20px rgba(0,0,0,.95),
      0 0 60px -15px rgba(100,210,255,.3),
      0 0 45px -20px rgba(161,140,209,.3),
      inset 0 1px 1px rgba(255,255,255,.7);
  }

  .board {
    display: grid;
    grid-template-columns: max-content 34px max-content 34px max-content;
    align-items: center;
    justify-content: center;
    padding: 36px 46px;
    background:
      radial-gradient(circle at 50% 0%, rgba(100,210,255,.14), transparent 50%),
      linear-gradient(180deg, rgba(12,14,26,.78), rgba(4,6,12,.72));
    backdrop-filter: blur(40px) saturate(170%);
    -webkit-backdrop-filter: blur(40px) saturate(170%);
    border-radius: 39px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.18),
      inset 0 -16px 32px rgba(0,0,0,.55);
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 16px;
    width: calc((var(--slot-w) * 2) + 10px);
  }

  .digit-group {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    height: var(--slot-h);
  }

  .roller-slot {
    position: relative;
    width: var(--slot-w);
    height: var(--slot-h);
    flex: 0 0 var(--slot-w);
    background:
      linear-gradient(180deg, rgba(255,255,255,.12), rgba(5,8,16,.7)),
      radial-gradient(circle at 50% 10%, rgba(100,210,255,.14), transparent 60%);
    backdrop-filter: blur(20px) saturate(155%);
    -webkit-backdrop-filter: blur(20px) saturate(155%);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow:
      inset 0 1.5px 2px rgba(255,255,255,.28),
      inset 0 -10px 22px rgba(0,0,0,.75),
      0 15px 30px -8px rgba(0,0,0,.8);
    transform: translateZ(0);
    transition:
      transform .35s cubic-bezier(.2,.8,.2,1),
      border-color .35s ease,
      box-shadow .35s ease;
  }

  .roller-slot::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: linear-gradient(180deg,
      rgba(2,3,8,.96) 0%,
      rgba(2,3,8,.22) 24%,
      transparent 44%,
      transparent 56%,
      rgba(2,3,8,.22) 76%,
      rgba(2,3,8,.96) 100%);
  }

  .roller-slot::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    z-index: 6;
    pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(255,240,220,.32), transparent);
  }

  .digit-strip {
    display: flex;
    flex-direction: column;
    width: 100%;
    margin: 0; padding: 0;
    transform: translateY(0);
    transition: transform .48s cubic-bezier(.25,1,.35,1);
    will-change: transform;
  }

  .digit-strip.rolling {
    filter: blur(0.8px);
  }

  .digit-cell {
    width: var(--slot-w);
    height: var(--slot-h);
    flex: 0 0 var(--slot-h);
    line-height: var(--slot-h);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Serif', serif;
    font-size: var(--font-digit);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    user-select: none;
    text-align: center;
    color: #ffe8bd;
    text-shadow: 0 0 12px rgba(255,220,160,.25), 0 5px 22px rgba(0,0,0,.95);
  }

  .unit-hours .digit-cell {
    background: linear-gradient(180deg, #fffdf8 10%, #ffe6b7 65%, #e5be7d 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .unit-minutes .digit-cell {
    background: linear-gradient(180deg, #fffdfb 10%, #ffe8df 62%, #e6a294 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .unit-seconds .digit-cell {
    background: linear-gradient(180deg, #fff 10%, #eee8fa 62%, #a18cd1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .label {
    width: 100%;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 4px;
    color: rgba(247,246,242,.7);
    text-align: center;
  }

  .label::before,
  .label::after {
    content: '';
    display: inline-block;
    width: 24px;
    height: 1px;
    margin: 0 10px 3px;
    background: linear-gradient(90deg, transparent, rgba(100, 210, 255, 0.7));
  }

  .label::after {
    background: linear-gradient(90deg, rgba(100, 210, 255, 0.7), transparent);
  }

  .separator {
    display: flex;
    flex: 0 0 34px;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    width: 34px;
    height: var(--slot-h);
    padding: 0;
    margin: 0;
  }

  .separator-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #64d2ff;
    opacity: .9;
    box-shadow: 0 0 8px rgba(100, 210, 255, 0.9), 0 0 20px rgba(100, 210, 255, 0.35);
    animation: gentlePulse 2s ease-in-out infinite;
  }

  .separator:nth-child(4) .separator-dot {
    background: #d7b9ff;
    box-shadow: 0 0 8px rgba(215,185,255,.9), 0 0 20px rgba(215,185,255,.3);
  }

  @keyframes gentlePulse {
    0%,100% { opacity: .9; transform: scale(1); }
    50% { opacity: .35; transform: scale(.8); }
  }

  .meridiem-bar {
    margin-top: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .amp-badge {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 6px 18px;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: var(--champagne);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255,255,255,0.25);
  }

  .tz-info {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: rgba(247, 246, 242, 0.6);
    letter-spacing: 2px;
  }

  @media (max-width: 820px) {
    :root {
      --slot-w: 62px;
      --slot-h: 96px;
      --font-digit: 52px;
    }
    .board {
      grid-template-columns: max-content 20px max-content 20px max-content;
      padding: 26px 28px;
    }
    .separator { width: 20px; flex-basis: 20px; }
  }

  @media (max-width: 580px) {
    :root {
      --slot-w: 44px;
      --slot-h: 70px;
      --font-digit: 36px;
    }
    .board {
      grid-template-columns: max-content 10px max-content 10px max-content;
      padding: 20px 14px;
      border-radius: 28px;
    }
    .glass-rim { border-radius: 29px; }
    .unit { gap: 10px; width: calc((var(--slot-w) * 2) + 6px); }
    .digit-group { gap: 6px; }
    .separator { width: 10px; flex-basis: 10px; gap: 10px; }
    .separator-dot { width: 5px; height: 5px; }
    .label { font-size: 8px; letter-spacing: 2px; }
    .label::before, .label::after { display: none; }
  }
</style>
</head>
<body>

<canvas id="webgl-bg"></canvas>
<div class="film-layer"></div>

<div id="stage">
  <div class="kicker">India Standard Time</div>
  <div class="date-display" id="dateLine">—</div>

  <div id="sceneWrap">
    <div class="glass-rim">
      <div class="board" id="board"></div>
    </div>
  </div>

  <div class="meridiem-bar">
    <div class="amp-badge" id="ampBadge">AM</div>
    <div class="tz-info">UTC +05:30</div>
  </div>
</div>

<script>
/* ================= DEEP SPACE 3D COSMOS SHADER ================= */
(function setupSpaceShader(){
  const canvas = document.getElementById('webgl-bg');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  const vertexShader = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position, 1.0);
    }
  `;

  const fragmentShader = `
    uniform float u_time;
    uniform vec2 u_mouse;
    uniform vec2 u_res;
    varying vec2 vUv;

    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

    float snoise(vec2 v) {
      const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
      vec2 i  = floor(v + dot(v, C.yy) );
      vec2 x0 = v - i + dot(i, C.xx);
      vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
      vec4 x12 = x0.xyxy + C.xxzz;
      x12.xy -= i1;
      i = mod289(i);
      vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
      vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
      m = m*m;
      m = m*m;
      vec3 x = 2.0 * fract(p * C.www) - 1.0;
      vec3 h = abs(x) - 0.5;
      vec3 ox = floor(x + 0.5);
      vec3 a0 = x - ox;
      m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
      vec3 g;
      g.x  = a0.x  * x0.x  + h.x  * x0.y;
      g.yz = a0.yz * x12.xz + h.yz * x12.yw;
      return 130.0 * dot(m, g);
    }

    float hash21(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float starLayer(vec2 uv, float scale, float threshold, float t) {
      vec2 gv = fract(uv * scale) - 0.5;
      vec2 id = floor(uv * scale);
      float h = hash21(id);
      if (h < threshold) return 0.0;
      float d = length(gv);
      float twinkle = sin(t * (h * 4.0 + 1.0) + h * 6.28) * 0.5 + 0.5;
      return (smoothstep(0.06, 0.0, d) * (0.6 + 0.4 * twinkle)) * (h * 0.8 + 0.2);
    }

    void main() {
      vec2 st = gl_FragCoord.xy / u_res.xy;
      st.x *= u_res.x / u_res.y;

      vec2 mouseOffset = (u_mouse - 0.5) * 0.12;
      vec2 p = st + mouseOffset;
      float t = u_time * 0.04;

      float n1 = snoise(p * 1.1 + vec2(t * 0.3, -t * 0.2));
      float n2 = snoise(p * 2.2 + vec2(-t * 0.2, t * 0.4) + n1 * 0.5);
      float n3 = snoise(p * 4.5 + vec2(t * 0.1, t * 0.1) + n2 * 0.25);

      vec3 deepVoid    = vec3(0.01, 0.01, 0.025);
      vec3 deepIndigo  = vec3(0.04, 0.06, 0.16);
      vec3 nebulaCyan  = vec3(0.12, 0.42, 0.65);
      vec3 nebulaPurple= vec3(0.38, 0.18, 0.55);
      vec3 starlight   = vec3(0.92, 0.88, 0.72);

      float nebulaShape = smoothstep(-0.4, 0.8, n1) * smoothstep(-0.3, 0.7, n2);
      vec3 color = mix(deepVoid, deepIndigo, smoothstep(-0.5, 0.5, n1));
      color += nebulaCyan * pow(max(0.0, n2), 1.8) * 0.65;
      color += nebulaPurple * pow(max(0.0, n1 * n2 + 0.2), 2.2) * 0.7;
      color += starlight * pow(max(0.0, n3 * nebulaShape), 3.0) * 0.2;

      float starsFar  = starLayer(st + mouseOffset * 0.2, 45.0, 0.965, u_time);
      float starsMid  = starLayer(st + mouseOffset * 0.5, 25.0, 0.982, u_time * 1.3);
      float starsNear = starLayer(st + mouseOffset * 0.8, 12.0, 0.992, u_time * 1.7);

      color += vec3(0.85, 0.92, 1.0) * starsFar * 0.7;
      color += vec3(0.95, 0.95, 1.0) * starsMid * 0.9;
      color += vec3(1.0, 0.95, 0.85) * starsNear * 1.3;

      gl_FragColor = vec4(color, 1.0);
    }
  `;

  const uniforms = {
    u_time: { value: 0 },
    u_mouse: { value: new THREE.Vector2(0.5, 0.5) },
    u_res: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
  };

  const material = new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms });
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
  scene.add(quad);

  let targetMX = 0.5, targetMY = 0.5;
  window.addEventListener('mousemove', (e) => {
    targetMX = e.clientX / window.innerWidth;
    targetMY = 1.0 - (e.clientY / window.innerHeight);
  });

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    uniforms.u_res.value.set(window.innerWidth, window.innerHeight);
  });

  const clock = new THREE.Clock();
  function renderLoop() {
    uniforms.u_time.value = clock.getElapsedTime();
    uniforms.u_mouse.value.x += (targetMX - uniforms.u_mouse.value.x) * 0.05;
    uniforms.u_mouse.value.y += (targetMY - uniforms.u_mouse.value.y) * 0.05;
    renderer.render(scene, camera);
    requestAnimationFrame(renderLoop);
  }
  renderLoop();
})();

/* ================= PRECISE ROLLER ENGINE ================= */
(function setupClock(){
  const board = document.getElementById('board');
  const dateLine = document.getElementById('dateLine');
  const ampBadge = document.getElementById('ampBadge');
  const sceneWrap = document.getElementById('sceneWrap');
  const IST_TZ = 'Asia/Kolkata';

  const UNITS = [
    { key: 'h', label: 'HOURS', cls: 'unit-hours' },
    { key: 'm', label: 'MINUTES', cls: 'unit-minutes' },
    { key: 's', label: 'SECONDS', cls: 'unit-seconds' }
  ];

  const digitEls = {};

  function buildRoller(container){
    const slot = document.createElement('div');
    slot.className = 'roller-slot';

    const strip = document.createElement('div');
    strip.className = 'digit-strip';

    for(let i = 0; i <= 10; i++){
      const cell = document.createElement('div');
      cell.className = 'digit-cell';
      cell.textContent = i % 10;
      strip.appendChild(cell);
    }

    slot.appendChild(strip);
    container.appendChild(slot);
    return { strip, current: 0 };
  }

  UNITS.forEach((u, idx) => {
    const unitDiv = document.createElement('div');
    unitDiv.className = `unit ${u.cls}`;

    const group = document.createElement('div');
    group.className = 'digit-group';

    const d1 = buildRoller(group);
    const d2 = buildRoller(group);

    unitDiv.appendChild(group);

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = u.label;
    unitDiv.appendChild(label);

    board.appendChild(unitDiv);
    digitEls[u.key] = [d1, d2];

    if (idx < UNITS.length - 1) {
      const sep = document.createElement('div');
      sep.className = 'separator';

      const dot1 = document.createElement('div');
      dot1.className = 'separator-dot';
      const dot2 = document.createElement('div');
      dot2.className = 'separator-dot';

      sep.appendChild(dot1);
      sep.appendChild(dot2);
      board.appendChild(sep);
    }
  });

  function rollDigit(obj, newVal){
    newVal = parseInt(newVal, 10);
    if(obj.current === newVal) return;

    const slot = obj.strip.parentElement;
    const slotHeight = slot.clientHeight;
    slot.classList.add('digit-changing');
    obj.strip.classList.add('rolling');

    if (obj.current === 9 && newVal === 0) {
      obj.strip.style.transition = 'transform 0.48s cubic-bezier(0.25, 1, 0.35, 1)';
      obj.strip.style.transform = `translateY(-${10 * slotHeight}px)`;

      setTimeout(() => {
        obj.strip.style.transition = 'none';
        obj.strip.style.transform = 'translateY(0px)';
        obj.strip.classList.remove('rolling');
        slot.classList.remove('digit-changing');
      }, 490);
    } else {
      obj.strip.style.transition = 'transform 0.48s cubic-bezier(0.25, 1, 0.35, 1)';
      obj.strip.style.transform = `translateY(-${newVal * slotHeight}px)`;
      setTimeout(() => {
        obj.strip.classList.remove('rolling');
        slot.classList.remove('digit-changing');
      }, 490);
    }
    obj.current = newVal;
  }

  function pad(n){ return n.toString().padStart(2, '0'); }

  function getISTParts(){
    const now = new Date();
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: IST_TZ,
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    });
    const parts = fmt.formatToParts(now);
    const map = {};
    parts.forEach(p => map[p.type] = p.value);
    return { h: parseInt(map.hour, 10) % 24, m: parseInt(map.minute, 10), s: parseInt(map.second, 10), now };
  }

  function updateClock(){
    const { h, m, s, now } = getISTParts();

    if (ampBadge) {
      ampBadge.textContent = h >= 12 ? 'PM' : 'AM';
    }
    const hDisplay = h % 12 === 0 ? 12 : h % 12;

    const hStr = pad(hDisplay);
    const mStr = pad(m);
    const sStr = pad(s);

    rollDigit(digitEls.h[0], hStr[0]);
    rollDigit(digitEls.h[1], hStr[1]);
    rollDigit(digitEls.m[0], mStr[0]);
    rollDigit(digitEls.m[1], mStr[1]);
    rollDigit(digitEls.s[0], sStr[0]);
    rollDigit(digitEls.s[1], sStr[1]);

    if (dateLine) {
      dateLine.textContent = now.toLocaleDateString('en-US', {
        timeZone: IST_TZ,
        weekday: 'long',
        month: 'long',
        day: 'numeric',
        year: 'numeric'
      }).toUpperCase();
    }
  }

  setInterval(updateClock, 1000);
  updateClock();

  let targetRX = 0, targetRY = 0;
  let curRX = 0, curRY = 0;
  window.addEventListener('mousemove', (e) => {
    const px = (e.clientX / window.innerWidth) - 0.5;
    const py = (e.clientY / window.innerHeight) - 0.5;
    targetRY = px * 7;
    targetRX = -py * 5;
  });

  function animateTilt(){
    curRX += (targetRX - curRX) * 0.05;
    curRY += (targetRY - curRY) * 0.05;
    sceneWrap.style.transform = `rotateX(${curRX}deg) rotateY(${curRY}deg)`;
    requestAnimationFrame(animateTilt);
  }
  animateTilt();
})();
</script>
</body>
</html>
